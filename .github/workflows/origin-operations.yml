name: OSCIRIS origin operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Origin operation to run through AWS Systems Manager
        required: true
        default: inspect
        type: choice
        options:
          - inspect

permissions:
  contents: read

jobs:
  origin:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Inspect active origin
        env:
          INSTANCE_ID: ${{ secrets.OSCIRIS_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Inspect OSCIRIS web origin" \
            --parameters '{"commands":["set -eu","printf '\''host=%s\\n'\'' \"$(hostname)\"","printf '\''identity=%s\\n'\'' \"$(id -un)\"","printf '\''listeners\\n'\''","ss -ltnp || true","printf '\''candidate-process-cwds\\n'\''","for pid in $(pgrep -f '\''next-server|npm.*start|serve.*out|nginx|caddy'\'' || true); do printf '\''%s '\'' \"$pid\"; readlink -f \"/proc/$pid/cwd\" || true; done","printf '\''candidate-services\\n'\''","systemctl list-units --type=service --all --no-legend | awk '\''tolower($1) ~ /osciris|next|node|nginx|caddy/ {print $1, $3, $4}'\'' || true","printf '\''candidate-repositories\\n'\''","for root in /home /srv /opt /var/www; do [ -d \"$root\" ] || continue; find \"$root\" -maxdepth 5 -type f -name package.json -print 2>/dev/null | while read -r manifest; do if grep -qi '\''osciris'\'' \"$manifest\"; then dirname \"$manifest\"; fi; done; done","printf '\''nginx-routing\\n'\''","nginx -T 2>/dev/null | grep -E '\''server_name|proxy_pass|root '\'' | grep -B2 -A4 -i osciris || true"]}' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
