name: OSCIRIS origin operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Origin operation to run through AWS Systems Manager
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy

permissions:
  contents: read

jobs:
  origin:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Inspect active origin
        if: inputs.operation == 'inspect'
        env:
          INSTANCE_ID: ${{ secrets.OSCIRIS_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Inspect OSCIRIS web origin" \
            --parameters '{"commands":["set -eu","printf '\''host=%s\\n'\'' \"$(hostname)\"","printf '\''identity=%s\\n'\'' \"$(id -un)\"","printf '\''listeners\\n'\''","ss -ltnp || true","printf '\''candidate-process-cwds\\n'\''","for pid in $(pgrep -f '\''next-server|npm.*start|serve.*out|nginx|caddy'\'' || true); do printf '\''%s '\'' \"$pid\"; readlink -f \"/proc/$pid/cwd\" || true; done","printf '\''candidate-services\\n'\''","systemctl list-units --type=service --all --no-legend | awk '\''tolower($1) ~ /osciris|next|node|nginx|caddy/ {print $1, $3, $4}'\'' || true","printf '\''origin-service\\n'\''","systemctl show oscirislabs.service -p User -p Group -p WorkingDirectory -p ExecStart","stat -c '\''repository-owner=%U:%G'\'' /srv/oscirislabs/site","printf '\''candidate-repositories\\n'\''","for root in /home /srv /opt /var/www; do [ -d \"$root\" ] || continue; find \"$root\" -maxdepth 5 -type f -name package.json -print 2>/dev/null | while read -r manifest; do if grep -qi '\''osciris'\'' \"$manifest\"; then dirname \"$manifest\"; fi; done; done","printf '\''nginx-routing\\n'\''","nginx -T 2>/dev/null | grep -E '\''server_name|proxy_pass|root '\'' | grep -B2 -A4 -i osciris || true"]}' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      - name: Deploy containment release
        if: inputs.operation == 'deploy'
        env:
          INSTANCE_ID: ${{ secrets.OSCIRIS_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy OSCIRIS public containment release" \
            --parameters '{"commands":["set -eu","cd /srv/oscirislabs/site","if [ -n \"$(runuser -u deploy -- /usr/bin/git status --porcelain)\" ]; then echo '\''refusing to overwrite a dirty origin checkout'\'' >&2; runuser -u deploy -- /usr/bin/git status --short >&2; exit 1; fi","runuser -u deploy -- /usr/bin/git fetch origin main","runuser -u deploy -- /usr/bin/git checkout main","runuser -u deploy -- /usr/bin/git pull --ff-only origin main","runuser -u deploy -- /usr/bin/npm ci","runuser -u deploy -- /usr/bin/npm run publish:bundles","runuser -u deploy -- /usr/bin/npm run build","systemctl restart oscirislabs.service","systemctl is-active --quiet oscirislabs.service","for attempt in $(seq 1 20); do if curl -fsS http://127.0.0.1:4173/ >/tmp/oscirislabs-home.html; then break; fi; sleep 2; done","grep -q '\''Detailed mechanisms are proprietary'\'' /tmp/oscirislabs-home.html","curl -fsS http://127.0.0.1:4173/proof-feed.json >/tmp/oscirislabs-proof.json","test \"$(jq -r '\''keys | sort | join(\",\")'\'' /tmp/oscirislabs-proof.json)\" = '\''proofs,status'\''","printf '\''deployed_commit=%s\\n'\'' \"$(runuser -u deploy -- /usr/bin/git rev-parse HEAD)\"","printf '\''service=%s\\n'\'' \"$(systemctl is-active oscirislabs.service)\""]}' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          result=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json)
          printf '%s\n' "$result"
          test "$(printf '%s' "$result" | jq -r .Status)" = Success
